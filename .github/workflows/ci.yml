name: CI

on:
  push:
  pull_request:

jobs:
  format:
    name: Python formatting (black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install black
        run: pip install "black==26.10.1"

      - name: Check formatting
        run: black --check lib
