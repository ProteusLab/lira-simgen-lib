name: CI

on:
  push:
  pull_request:

jobs:
  format:
    name: Python formatting (black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install black
        run: pip install "black==26.10.1"

      - name: Check formatting
        run: black --check lib cpp

  test:
    name: C++ codegen unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "git+https://github.com/ProteusLab/LIRA@v0.1.1#subdirectory=python" jinja2 pytest pytest-cov

      - name: Run tests with coverage
        run: pytest --cov=cpp --cov-fail-under=90 --cov-report=term-missing cpp/tests

  convert:
    name: Protea IR -> LIRA IR conversion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install converter dependencies
        run: pip install "git+https://github.com/ProteusLab/LIRA@v0.1.1#subdirectory=python"

      - name: Configure
        run: cmake -B build -DARCH_TARGET=RISC_V -DARCH_SOURCE=Protea

      - name: Generate the LIRA IR
        run: cmake --build build --target gen-ir

      - name: Verify the generated IR
        run: python3 utils/protea2lira/check_ir.py --ir-path build/lira_ir/RISC_V.yaml

  codec:
    name: Encoder, decoder, and formatter generation and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install Python dependencies
        run: pip install ruamel.yaml jinja2

      - name: Configure
        run: cmake -B build -DARCH_TARGET=RISC_V -DARCH_SOURCE=Protea

      - name: Generate encoder, decoder, and formatter sources
        run: cmake --build build --target gen-encoder gen-decoder gen-formatter

      - name: Build encoder, decoder, and formatter
        run: cmake --build build --target build-encoder build-decoder build-formatter
